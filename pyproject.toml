[project]
name = "project-1"
version = "0.1.0"
description = ""
authors = [
    {name = "Ilonchik",email = "ilonafedulova91@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=3.0.1,<4.0.0)",
    "requests (>=2.33.0,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]

[tool.mypy]
disallow_untyped_defs = false
warn_return_any = true
ignore_missing_imports = true
exclude = ['venv', 'tests', 'src/decorators', 'src/generators', 'src/external_api', 'src/processing']

[tool.black]
line-length = 119
force-exclude = '''
/(
\.git
| \.mypy_cache
| \.venv
)/
'''

[tool.isort]
line_length = 119
